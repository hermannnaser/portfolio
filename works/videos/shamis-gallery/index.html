    <style>
        .shamis-video {
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #000;

            display: block;
            width: 100%;
            height: 100%;

                id="menu-toggle"

                for="menu-toggle"
                class="menu-button"
            >
                <img

                    class="menu-icon menu-icon-normal"

                <img
                    src="../../../themes/default/images/menu-hover.png"

            <div class="navigation-menu">
                <ul>
                    <li>
                        <a href="../../../index.html">Home</a>

                            type="checkbox"

                        <a href="../../../contact/index.html">
                            Contact
                        </a>
                    </li>

            <p class="works-label">WORKS</p>

        </section>

        <section class="video-company">

            <div class="company-header">
                <span class="company-number">03</span>

                <div>
                    <h2>Shamis Gallery</h2>
                    <p>Videography</p>
                </div>
            </div>

            <div class="shamis-video">
                <video
                    controls
                    playsinline
                    preload="metadata"
                >
                    <source
                        src="../../../media/videos/shamis/open-state.mp4"
                        type="video/mp4"

                </video>

        <p style="margin-top: 40px;">
